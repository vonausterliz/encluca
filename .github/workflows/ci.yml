# Test, controllo delle vulnerabilità note (govulncheck) e ricerca di segreti (gitleaks)
# a ogni push, pull request e ogni lunedì (nuove vulnerabilità note anche senza modifiche al codice:
# se fallisce GitHub manda una mail, vedi docs/SICUREZZA-AGGIORNAMENTI.md).
# Le Actions sono fissate a uno SHA (il commento indica la versione).
name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Modulo WebAssembly
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o web/vault.wasm ./cmd/vaultwasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js
      - run: go vet ./...
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  segreti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gitleaks (tutta la storia)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact --no-banner
