# Pubblica l'immagine dell'hub su ghcr.io al push di un tag vX.Y.Z (o a mano, indicando il tag).
# Le release ora stanno in vonausterliz/encluca-releases, quindi il segnale è il tag, non la release.
# Le Actions sono fissate a uno SHA (il commento indica la versione): un tag spostato da chi
# controlla il repository dell'Action non può cambiare ciò che gira qui.
name: Immagine Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release da pubblicare (es. v0.1.3)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Scelta del tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      # sorgente della release richiesta…
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          path: src
      # …e Dockerfile aggiornato (le release più vecchie potrebbero non averlo)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vonausterliz/encluca:${{ steps.tag.outputs.version }}
            ghcr.io/vonausterliz/encluca:latest
